<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animate CSS</title>

    <link rel="stylesheet" href="style.css">

    <style>
        h1 {
            color: white;
            opacity: 1;
            max-height: 100px;
            background-color: red;
            transition: all 1s ease-in-out;
            display: block;
        }

        h1.hidden {
            opacity: 0;
            max-height: 0;
            padding: 0;
            margin: 0;
        }
    </style>

</head>

<body style="background-color: rgb(6, 6, 95);">

    <!-- Learn Animate CSS -->


    <h1 id="myTitle" class="animate__animated animate__headShake">Mohamed Samy Program</h1>
    <h2>Mohamed</h2>

    <script type="module" src="/script.js"></script>


</body>

</html>
